name: "Luke Roberts Lamp Control"
description: >
  Direct BLE Bluetooth gateway for Luke Roberts smart lamps (Model F / Luvo).
  No ESPHome or extra hardware required — runs on the Home Assistant host
  and bridges BLE to HA entities via MQTT Auto-Discovery.
version: "1.0.0"
slug: "lukeroberts_lampcontrol"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
homeassistant: "2023.1.0"
startup: services
boot: auto
host_dbus: true
privileged:
  - NET_ADMIN
  - SYS_ADMIN
apparmor: false
map:
  - config:rw
options:
  lamp_mac: ""
  lamp_name: "Luke Roberts Lamp"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_topic_prefix: "lukeroberts"
  log_level: "info"
schema:
  lamp_mac: str
  lamp_name: str
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
  mqtt_topic_prefix: str
  log_level: "list(debug|info|warning|error)"
